:root[data-theme="dark"] { --bg: #1B0E06; --ink: #FFF1CC; --mute: #A89877; --hair: rgba(255, 241, 204, .16); --rail: var(--accent-dk); --logo: url("__LOGO_CREAM__"); color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--body); direction: rtl; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
.wrap { max-width: 520px; margin: 0 auto; padding-block: 20px 56px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); display: grid; gap: 26px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--rail); outline-offset: 3px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.who { display: flex; align-items: center; gap: 12px; }
.logo { flex: none; width: 36px; height: 50px; background: var(--logo) center / contain no-repeat; }
.who b { display: block; font: var(--hw) 26px/1.1 var(--head); }
.who small { color: var(--mute); font-weight: 700; font-size: 14px; }
.clock { text-align: left; color: var(--mute); font-weight: 700; font-size: 14px; line-height: 1.3; white-space: nowrap; }
.clock b { display: block; color: var(--ink); font: var(--hw) 24px/1 var(--head); }

/* الشبكة (من اليمين لليسار): الساعة أو اليوم يمين، ثم الخط، ثم اسم البرنامج يسار */
.row { display: grid; grid-template-columns: 148px 24px 1fr; column-gap: 8px; }
.lab { text-align: end; padding-top: 2px; padding-inline-end: 2px; }
.lab b { display: block; font: var(--hw) 30px/1.05 var(--head); }
.lab small { display: block; color: var(--mute); font-weight: 500; font-size: 14px; line-height: 1.35; margin-top: 2px; }
.rl { position: relative; }
.rl::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 6px; transform: translateX(-50%); background: repeating-linear-gradient(135deg, var(--rail) 0 1.6px, transparent 1.6px 4.5px); }
.ring { position: absolute; left: 50%; top: 4px; width: 22px; height: 22px; transform: translateX(-50%); border-radius: 50%; border: 3px solid var(--rail); background: var(--bg); }
.tick { position: absolute; left: 50%; top: 14px; width: 12px; height: 2px; background: var(--rail); transform: translateX(-100%); margin-left: -3px; }
.row.first .rl::before { top: 0; }
.it { padding-bottom: 20px; min-width: 0; }
.it .t { display: flex; align-items: baseline; gap: 6px; line-height: 1.2; }
.it .t b { font-weight: 800; font-size: 21px; }
.it .t span { color: var(--mute); font-weight: 500; font-size: 17px; }
.it .nm { color: var(--ink); opacity: .78; font-weight: 500; font-size: 16px; line-height: 1.45; margin-top: 2px; }

/* الدائرة: البرنامج التالي */
.row.next { margin-bottom: 14px; min-height: 176px; align-items: stretch; }
.row.next .lab { padding: 0; align-self: center; }
.kick { color: var(--mute); font-weight: 800; font-size: 15px; margin-bottom: 4px; }
.circ { width: 176px; height: 176px; margin-right: -18px; border-radius: 50%; background: var(--accent); color: var(--on); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 30px 0 12px; gap: 4px; }
.circ .tm { display: flex; align-items: baseline; gap: 5px; }
.circ .tm b { font: var(--hw) 50px/1 var(--head); }
.circ .tm span { font-weight: 800; font-size: 18px; }
.circ .cd { font-weight: 800; font-size: 16px; line-height: 1.35; white-space: nowrap; }
.circ .cd span { display: block; }
.row.next .ring { top: 50%; transform: translate(-50%, -50%); }
.row.next .it { align-self: center; padding-bottom: 0; }
.row.next .it h1 { margin: 0; font: var(--hw) clamp(30px, 8.6vw, 38px)/1.2 var(--head); text-wrap: balance; }
.now { margin-top: 12px; color: var(--mute); font-weight: 700; font-size: 14px; line-height: 1.45; }
.now i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #D8453A; margin-inline-end: 6px; }
.now .bar { height: 3px; background: var(--hair); margin-top: 6px; }
.now .bar b { display: block; height: 100%; background: var(--rail); width: 0; }
.big { font: var(--hw) 40px/1.2 var(--head); padding: 6px 0; }
.more { justify-self: start; border: 0; background: transparent; color: var(--ink); font-weight: 800; border-bottom: 2px solid var(--rail); padding: 0 0 2px; }
.dots { height: 80px; width: 150px; background: radial-gradient(var(--rail) 1.3px, transparent 1.6px) 0 0 / 12px 12px; opacity: .35; }
.foot { display: grid; gap: 14px; color: var(--mute); font-size: 13px; font-weight: 500; }
.foot .g { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pals button { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--bg); padding: 0; box-shadow: 0 0 0 1px var(--hair); }
.pals button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.foot .fonts button { border: 0; background: var(--hair); border-radius: 99px; padding: 1px 12px 3px; font-weight: 700; font-size: 14px; color: var(--mute); }
.foot .fonts button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.foot .demo button { border: 0; background: var(--hair); border-radius: 99px; padding: 1px 12px 3px; font-weight: 700; font-size: 13px; color: var(--mute); }
.foot .demo button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
</style>

<div class="wrap">
  <header class="top">
    <div class="who"><div class="logo" role="img" aria-label="شعار حائل ذرية ناصر الصالح ١٤٤٨هـ"></div><div><b>رحلة حائل</b><small id="range"></small></div></div>
    <div class="clock" id="clock"></div>
  </header>
  <main id="app"></main>
  <div class="dots" aria-hidden="true"></div>
  <footer class="foot">
    <div class="g pals" id="pals" role="group" aria-label="لون الصفحة"></div>
    <div class="g fonts" id="fonts" role="group" aria-label="خط العناوين"></div>
    <div class="g demo" id="demo"></div>
    <div>الأوقات بتوقيت الرياض، وتتحدّث الصفحة وحدها كل نصف دقيقة.</div>
  </footer>
